name: Update REI API usage

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rei-usage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and publish report
        env:
          REI_API_KEY: ${{ secrets.REI_API_KEY }}
          REI_USAGE_URL: ${{ secrets.REI_USAGE_URL }}
        run: bash ./rei-usage-sync.sh "$GITHUB_WORKSPACE"
